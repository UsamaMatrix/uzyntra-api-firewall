server:
  public_bind_addr: "127.0.0.1:8080"
  admin_bind_addr: "127.0.0.1:9090"
  trust_x_forwarded_for: false
  environment: "development"
  admin_public_health_enabled: true

proxy:
  upstream_base_url: "https://httpbin.org"
  connect_timeout_secs: 5
  request_timeout_secs: 20
  pool_idle_timeout_secs: 30
  max_body_bytes: 1048576

security:
  blocked_methods:
    - "TRACE"
    - "CONNECT"
  request_id_header: "x-request-id"
  inspect_headers: true
  inspect_query_string: true
  inspect_body: true
  max_inspection_body_bytes: 32768
  temp_ban_secs: 900
  temp_suspicious_secs: 300
  suspicious_score_threshold: 12
  policy_mode: balanced
  min_block_confidence: 0.85
  min_block_score: 65.0
  rate_limit:
    requests_per_window: 60
    window_secs: 60
  rule_modes:
    method.disallowed: block
    path.traversal.basic: block
    sqli.basic: block
    xss.basic: block
    cmdi.basic: block
    ssrf.basic: recommend
    evasion.encoding: recommend
    header.crlf: block
    smuggling.cl_te: recommend
    auth.missing_api_key: block
    auth.invalid_api_key: block
    body.sqli.basic: block
    body.xss.basic: block
    body.cmdi.basic: block
    rate_limit.exceeded: block
    missing.x_content_type_options: detect_only
    missing.x_frame_options: detect_only
    missing.csp: detect_only
    UZ-API-SCHEMA-001: recommend
    UZ-API-SCHEMA-002: recommend
    UZ-SSRF-001: recommend
    UZ-AUTH-ABUSE-001: block
    UZ-AUTH-ABUSE-002: block
    UZ-API-RESOURCE-001: recommend
    UZ-API-INV-001: detect_only
  route_overrides:
    - path_prefix: "/proxy/get"
      rule_modes:
        ssrf.basic: detect_only
    - path_prefix: "/proxy/post"
      rule_modes:
        body.sqli.basic: block
        body.xss.basic: block
  route_rate_limits:
    - path_prefix: "/proxy/post"
      requests_per_window: 10
      window_secs: 60
    - path_prefix: "/proxy/get"
      requests_per_window: 30
      window_secs: 60
  route_behavior_overrides: []
  detector_exceptions: []

behavior:
  enabled: true
  rps_spike_threshold_z: 4.0
  body_spike_threshold_z: 5.0
  warmup_min_samples: 5
  object_enumeration_threshold: 15
  object_window_secs: 300
  auth_attempt_window_secs: 300
  auth_bruteforce_threshold: 8
  password_spray_threshold: 5
  max_entries: 10000
  max_ids_per_entry: 128

discovery:
  enabled: true
  shadow_min_hits: 3
  max_learned_routes: 5000
  schema_min_samples: 5
  max_schema_routes: 2000
  max_schema_fields: 80
  max_json_depth: 16
  max_json_array_len: 200
  max_query_params: 100
  max_normalized_bytes: 16384
  max_decode_passes: 2

telemetry:
  log_level: "info"
  security_event_log_path: "data/security-events.jsonl"

control_plane:
  telemetry_enabled: false
  enrollment_enabled: false
  enrollment_url: "http://127.0.0.1:3000/api/firewalls/enroll"
  enrollment_token: ""
  ingestion_url: "http://127.0.0.1:3000/api/ingest/security-events"
  api_key: ""
  firewall_instance_id: ""
  installation_identifier: ""
  hostname: ""
  version: "0.1.0"
  region: ""
  request_timeout_ms: 5000
  queue_capacity: 1024

storage:
  sqlite_path: "data/api_firewall.db"

auth:
  enabled: true
  header_name: "x-api-key"
  api_keys:
    - "dev-secret-key-1"
  protected_path_prefixes:
    - "/proxy/anything/protected"
    - "/proxy/post"
  admin:
    enabled: true
    header_name: "x-admin-token"
    token: "dev-admin-token-1"
